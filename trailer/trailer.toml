# The videocraft launch trailer: timeline, data sources and the trailer's own takes. trailer/README.md says how.

seconds = 84.4
fps = 60
poster = 81.5

# ---------------------------------------------------------------- the trailer's own takes (trailer/footage.py)
# Footage the finished runs do not have, filmed by videocraft, each with the game's own captions.

[[footage.take]]
name = "keynote"
script = "trailer/footage/keynote.toml"

[[footage.take]]
name = "panorama"
script = "trailer/footage/panorama.toml"

[[footage.take]]
name = "build"
run = "trailer-build"
set = "keynote-stage"
at = [0, 230, 0]
staged = 7
order = [[16, 17], [12, 15], [18, 33], [41, 46], [47, 59], [119, 131], [34, 40], [99, 118], [7, 10]]
start = 0.6
span = 5.6
duration = 7.5
camera = '{ rig = "dolly", from = [0.5, 262.0, 46.0], to = [0.5, 252.0, 30.0], at = [0.5, 233.0, -8.0], ease = "smooth", fov = 62 }'
caption = [{ shot = "build", at = 0.8, text = "Building *keynote-stage, block by block." }]

[[footage.take]]
name = "bees"
from = "examples/bees.toml"
run = "trailer-bees"
caption = [
  { shot = "swarm", at = 0.5, text = "Oh. Hi, *bees.", speaker = "Ben", color = "#9fe0a0" },
  { shot = "swarm", at = 5.7, text = "Okay. *Angry bees.", speaker = "Ben", color = "#9fe0a0" },
]

# ---------------------------------------------------------------- the piece

[exports]
h = "videocraft-trailer-1080p60.mp4"
v = "videocraft-trailer-9x16.mp4"
poster = "videocraft-trailer-poster.png"

# Deep warm charcoal, warm off-white type, one accent: the grass green of the videocraft block.
[colors]
bg = "#141312"
bg2 = "#1d1b19"
panel = "#1c1b19"
panel2 = "#23221f"
line = "#34312d"
text = "#f2eee6"
muted = "#a39d93"
dim = "#57534c"
accent = "#86d36a"
warn = "#e06c5a"

# Captured output and measured data (trailer/data/, written by `make.py capture` from the commands in README.md).
[data]
story = "story-show.txt"
gamelog = "game-log.txt"
make = "make.txt"
run = "run-story2.txt"
voice = "voice-nibs.json"
voice_check = "voice-check.txt"
review = "review.json"

# Footage, under runs/ (README.md: which runs, and how each was made). *_v: true 9:16 takes of the same shots.
[media]
fu_headroom = "fu-beauty/0002/take/shots/headroom/video.mp4"
fu_headroom_v = "fu-beauty-v/0002/take/shots/headroom/video.mp4"
fu_orbit = "fu-beauty/0002/take/shots/orbit/video.mp4"
fu_orbit_v = "fu-beauty-v/0002/take/shots/orbit/video.mp4"
fu_pair = "fu-beauty/0002/take/shots/pair/video.mp4"
fu_pair_v = "fu-beauty-v/0002/take/shots/pair/video.mp4"
fu_flyin = "fu-flyin/0003/take/shots/flyin/video.mp4"
fu_take = "fu-take/0002/cut/master.mp4"
fu_take_v = "fu-take-v/0003/cut/master.mp4"
fu_jump = "fu-jump/0002/cut/master.mp4"
fu_jump_v = "fu-jump-v/0001/cut/master.mp4"
marks = "fu-marks/0006/take/shots/wide/video.mp4"
barn_build = "fu-build-barn-stage/0003/take/shots/build/video.mp4"
nibs = "nibs-vs-duke/0012/cut/x-1080p60-original-audio.mp4"

# The story at a human pace, one idea per beat, every beat dissolving into the next (no empty canvas between them):
# the ask over the barn at dusk; the prompt typed into the agent app; the take opening out of the app's line, each
# step named in plain words; the edit; the review; the jump-off itself; the name over the barn at sunset.

[[scene]]
type = "card"
from = 0.0
to = 3.6
bg = { media = "fu_headroom", in = 0.2, media_v = "fu_headroom_v", in_v = 0.2 }
dim = 0.5
kicker = "videocraft"
text = "Ask for a film."

[[scene]]
type = "t3"
from = 3.0
to = 23.4
fade_in = 0.6
thread = "Nibs vs Duke"
project_path = "~/videocraft"
projects = [
  { name = "videocraft", threads = ["Nibs vs Duke", "Trailer", "Voice pass", "Sets"] },
]
placeholder = "Ask anything, @ to mention files"
composer_hint = "Opus 5.5 · Full access"
prompt = "a one-horned goat challenges a snow fox to a jump-off"
type_from = 4.6
type_to = 11.4
send_at = 12.3
cut_at = 22.5
focus = "recording at"
working = "Working…"
messages = [
  { kind = "text", t = 13.0, wps = 4.0, text = "On it. I'll draft the story, then film it in a hidden Minecraft." },
  { kind = "text", t = 16.6, wps = 4.0, text = "{story}" },
  { kind = "tool", t = 18.6, title = "Ran", command = "bin/videocraft run examples/nibs-vs-duke.toml", lines = [
    { t = 19.3, data = "gamelog", match = 'shot s01-nibs recording at', strip = '^.*\(videocraft\) (VIDEOCRAFT )?' },
  ] },
]

[[scene]]
type = "mcmonitor"
from = 22.9
to = 39.4
steps = 4
clips = [
  { at = 22.9, dur = 4.5, media = "barn_build", in = 0.3, step = 2, fx = 0.5, shot_dir = "fu-build-barn-stage/0003/take/shots/build", intro_from = "t3", intro = 0.9, overlay = "toast", icon = "oak_sign", toast_title = "barn-stage", toast = ['[[world.set]]', 'name = "barn-stage"'], label = "Builds the set" },
  { at = 27.4, dur = 4.0, media = "fu_flyin", in = 0.4, step = 2, fx = 0.45, shot_dir = "fu-flyin/0003/take/shots/flyin", overlay = "rec", label = "Flies the camera" },
  { at = 31.4, dur = 4.0, media = "marks", in = 3.0, step = 2, fx = 0.5, shot_dir = "fu-marks/0006/take/shots/wide", overlay = "map", label = "Actors to marks" },
  { at = 35.4, dur = 4.0, media = "fu_pair", in = 0.6, media_v = "fu_pair_v", in_v = 0.6, shot_dir = "fu-beauty/0002/take/shots/pair", overlay = "rec", label = "Rolls the take" },
]

[[scene]]
type = "mcedit"
from = 39.0
to = 51.2
fade_in = 0.4
heading = "Then it edits."
heading_until = 41.7
media = "nibs"
title = "§fcut/timeline.json §7nibs-vs-duke 0012: 34 clips, 76.87 s"
title_v = "§ftimeline.json §734 clips"
step = 4
slide_at = 41.5
lanes_at = 41.9
scrub_at = 42.1
scrub_dur = 9.0
scrub_to = 34.0

[[scene]]
type = "mcscores"
from = 50.8
to = 61.8
fade_in = 0.4
heading = "Then it reviews itself."
heading_v = "Then it\nreviews itself."
heading_until = 53.8
clip = { media = "nibs", in = 55.6, media_v = "fu_orbit_v", in_v = 0.5 }
panel_at = 53.6

[[scene]]
type = "mcreel"
from = 61.5
to = 75.6
fade_in = 0.3
clips = [
  { at = 61.5, dur = 4.6, media = "fu_take", in = 0.15, media_v = "fu_take_v", in_v = 0.15 },
  { at = 66.1, dur = 3.2, media = "fu_jump", in = 0.0, media_v = "fu_jump_v", in_v = 0.0 },
  { at = 69.3, dur = 3.6, media = "fu_jump", in = 3.2, media_v = "fu_jump_v", in_v = 3.2 },
  { at = 72.9, dur = 2.7, media = "fu_jump", in = 6.8, media_v = "fu_jump_v", in_v = 6.8 },
]

[[scene]]
type = "endmodern"
from = 75.1
to = 84.4
fade_in = 0.5
bg = { media = "fu_orbit", in = 0.5, media_v = "fu_orbit_v", in_v = 0.5 }
dim = 0.62
name = "videocraft"
tagline = "Agent-directed films, shot inside Minecraft."
tagline_v = "Agent-directed films,\nshot inside Minecraft."
command = '$ bin/videocraft make "<prompt>"'
command_v = "$ bin/videocraft make\n  \"<prompt>\""
type_from = 76.6
type_to = 77.3
url_at = 77.4
url = "github.com/alexandros-lekkas/videocraft"
url_v = "github.com/\nalexandros-lekkas/videocraft"
disclaimer = "Unofficial. Not affiliated with Mojang or Microsoft."
disclaimer_v = "Unofficial. Not affiliated\nwith Mojang or Microsoft."

# ---------------------------------------------------------------- sound
# The main sound track is the game's own: music picked from the mood map, the GUI's sounds, the takes' own mixes.
# The `-original-audio` twin swaps each for an original one: the synth bed, library sounds, and for the takes only
# their voiced lines (placed from each run's voice.json), so it holds no Mojang audio.
[audio]
lufs = -14.0
ceiling = -1.5
mood = "upbeat"
style = "keynote"
bpm = 120
seed = 7
film = [
  { t = 61.5, start = 0.15, dur = 4.6, db = 0.0, game = "runs/fu-take/0002/cut/master.mp4", voice_run = "runs/fu-take/0002" },
  { t = 66.1, start = 0.0, dur = 9.5, db = 0.0, game = "runs/fu-jump/0002/cut/master.mp4", voice_run = "runs/fu-jump/0002" },
]
music = [[0.0, -60], [0.4, -9], [3.0, -9], [12.3, -9], [12.8, -6], [22.4, -6], [22.9, -1], [50.6, -2], [61.2, -2], [61.6, -17], [75.0, -17], [75.4, -4], [83.2, -4], [84.4, -60]]
