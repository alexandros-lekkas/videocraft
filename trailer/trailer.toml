# The videocraft launch trailer: timeline, data sources and the trailer's own takes. trailer/README.md says how.

seconds = 68.0
fps = 60
poster = 61.9

# ---------------------------------------------------------------- the trailer's own takes (trailer/footage.py)
# Footage the finished runs do not have, filmed by videocraft, each with the game's own captions.

[[footage.take]]
name = "keynote"
script = "trailer/footage/keynote.toml"

[[footage.take]]
name = "bees"
from = "examples/bees.toml"
run = "trailer-bees"
caption = [
  { shot = "swarm", at = 0.5, text = "Oh. Hi, *bees.", speaker = "Ben", color = "#9fe0a0" },
  { shot = "swarm", at = 5.7, text = "Okay. *Angry bees.", speaker = "Ben", color = "#9fe0a0" },
]

[[footage.take]]
name = "rigs"
from = "examples/rigs.toml"
run = "trailer-rigs"
caption = [
  { shot = "lead", at = 0.4, text = "*Lead: the camera walks ahead." },
  { shot = "chase", at = 0.3, text = "*Chase: it follows behind." },
  { shot = "track", at = 0.3, text = "*Track: alongside, at the same pace." },
  { shot = "dolly", at = 0.3, text = "*Dolly: a straight move on a rail." },
  { shot = "crane", at = 0.3, text = "*Crane: up and over the subject." },
  { shot = "locked", at = 0.3, text = "*Locked: a fixed eye that pans." },
  { shot = "two-shot", at = 0.3, text = "*Two-shot: both of them in frame." },
  { shot = "face", at = 0.3, text = "*Face: the cut-in." },
  { shot = "fixed-zoom", at = 0.3, text = "*Zoom: the lens from 70 to 40." },
  { shot = "orbit-actor", at = 0.3, text = "*Orbit: a quarter turn around." },
]

# ---------------------------------------------------------------- the piece

[exports]
h = "videocraft-trailer-1080p60.mp4"
v = "videocraft-trailer-9x16.mp4"
poster = "videocraft-trailer-poster.png"

# Deep warm charcoal, warm off-white type, one accent: the grass green of the videocraft block.
[colors]
bg = "#141312"
bg2 = "#1d1b19"
panel = "#1c1b19"
panel2 = "#23221f"
line = "#34312d"
text = "#f2eee6"
muted = "#a39d93"
dim = "#57534c"
accent = "#86d36a"
warn = "#e06c5a"

# Captured output and measured data (trailer/data/, written by `make.py capture` from the commands in README.md).
[data]
make = "make.txt"
run = "run-story2.txt"
voice = "voice-talk.json"
voice_check = "voice-check.txt"
framemd5 = "framemd5.csv"
framemd5_meta = "framemd5.json"
review = "review.json"

# Footage, under runs/ (README.md: which runs, and how each was made). *_v: the tool's own 9:16 re-frames.
[media]
story = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/cut/master.mp4"
story_v = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/clips/r1/short-1080x1920.mp4"
nibs = "nibs-vs-duke/0012/cut/x-1080p60-original-audio.mp4"
short = "nibs-vs-duke/0012/clips/r1/short-1080x1920.mp4"
lane_v = "nibs-vs-duke/0012/clips/r2/short-1080x1920.mp4"
barn_v = "nibs-vs-duke/0012/clips/r3/short-1080x1920.mp4"
card_v = "nibs-vs-duke/0012/clips/r4/short-1080x1920.mp4"
challenge_v = "nibs-vs-duke/0012/clips/r5/short-1080x1920.mp4"
bees = "trailer-bees/0001/cut/master.mp4"
bees_v = "trailer-bees/0001/clips/r1/short-1080x1920.mp4"
keynote = "trailer-keynote/0002/cut/master.mp4"
hall_v = "trailer-keynote/0002/clips/r1/short-1080x1920.mp4"
presenter_v = "trailer-keynote/0002/clips/r2/short-1080x1920.mp4"
rigs1 = "trailer-rigs/0001/cut/master.mp4"
rigs2 = "trailer-rigs/0002/cut/master.mp4"
talk = "talk/0001/cut/master.mp4"

# At 120 bpm a beat is 0.5 s; sections overlap their neighbours by a few tenths so no frame is ever empty.

[[scene]]
type = "make"
from = 0.0
to = 10.2
title = "videocraft — zsh"
command = 'bin/videocraft make "a goat challenges a fox to a jump-off" --dry-run'
command_v = "bin/videocraft make\n  \"a goat challenges a fox to a jump-off\"\n  --dry-run"
type_at = 0.3
cps = 26
enter = 3.1
dock = 3.6
exit = 9.6
header = "One prompt. Every step writes a file you can *read."
header_v = "One prompt. Every step\nwrites a file you can *read."
footer = "stories/{story}/      runs/{story}/0002/"
out = [
  { t = 3.1, match = '^STORY' },
  { t = 3.35, match = '^  premise: asking' },
  { t = 5.75, match = '^RESULT\s+PASS shots.toml' },
  { t = 6.0, typed = "bin/videocraft run stories/a-goat-challenges-a-fox-to-a-jump-off-2/shots.toml", typed_v = "bin/videocraft run\n  stories/a-goat-challenges-a-fox-to-a-jump-off-2/shots.toml", cps = 75 },
]
nodes = [
  { t = 4.5, name = "premise", file = "premise.md", match = '^STAGE\s+premise' },
  { t = 4.75, name = "bible", file = "bible.toml", match = '^STAGE\s+bible' },
  { t = 5.0, name = "outline", file = "outline.md", match = '^STAGE\s+outline' },
  { t = 5.25, name = "script", file = "script.md", match = '^STAGE\s+script' },
  { t = 5.5, name = "shot list", file = "shots.toml", match = '^STAGE\s+shots' },
  { t = 7.25, name = "hidden game", file = "game.log", data = "run", match = '^videocraft \d.*hidden' },
  { t = 7.6, name = "frames", file = "frames.csv", data = "run", match = 'recording at 1920x1080' },
  { t = 8.0, name = "cut", file = "master.mp4", data = "run", match = '^RESULT' },
  { t = 8.35, name = "measure", file = "report.md", data = "run", match = '^VIDEO' },
  { t = 8.75, name = "review", file = "review/*.json" },
  { t = 9.1, name = "climb", file = "score.json" },
]

# The film that prompt made, out of the terminal.
[[scene]]
type = "footage"
from = 9.75
to = 12.1
clips = [
  { at = 9.75, dur = 2.35, media = "story", in = 49.6, media_v = "story_v", in_v = 0.0, intro = 0.7, intro_from = "terminal", label = "runs/a-goat-challenges-a-fox-to-a-jump-off-2/0002/cut/master.mp4", label_v = "runs/a-goat-…-jump-off-2/0002/cut/master.mp4", tag_v = "the film from that prompt: 25 shots, 55 s\n(one hop height fixed by hand)", tag = "the film from that prompt: 25 shots, 55 s (one hop height fixed by hand)" },
]

[[scene]]
type = "title"
from = 11.95
to = 14.2
exit = 13.65
lines = [
  { text = "videocraft", y = 0.36, size = 40, t = 12.0, face = "mono", color = "accent", weight = "medium" },
  { text = "Every shot from a script.", y = 0.49, size = 88, t = 12.15 },
  { text = "Filmed inside the *game.", y = 0.60, size = 88, t = 12.45 },
]
lines_v = [
  { text = "videocraft", y = 0.33, size = 48, t = 12.0, face = "mono", color = "accent", weight = "medium" },
  { text = "Every shot", y = 0.42, size = 104, t = 12.15 },
