[[scene]]
type = "footage"
from = 13.6
to = 28.0
title_v = "Filmed inside\nthe game."
clips = [
  { at = 13.6, dur = 2.4, media = "nibs", in = 1.6, media_v = "lane_v", in_v = 0.0, intro = 0.6, label = 'camera = { rig = "lead", subject = "nibs", fov = 108 }', tag = "a lead track down the market lane  ·  nibs-vs-duke s01" },
  { at = 16.0, dur = 2.0, media = "bees", in = 22.9, media_v = "bees_v", in_v = 0.08, label = 'do = "swarm", around = "ben", angry = true', tag = "five scripted bees  ·  examples/bees.toml" },
  { at = 18.0, dur = 2.0, media = "nibs", in = 36.7, media_v = "barn_v", in_v = 0.07, label = '[[edit.look]] frame = { color = "#e8a23a" }', tag = "a framed, graded flashback  ·  nibs-vs-duke s14" },
  { at = 20.0, dur = 2.0, media = "keynote", in = 1.3, media_v = "hall_v", in_v = 0.1, label = '[[world.set]] name = "keynote-stage"', tag = "a set built from data  ·  sets/keynote-stage.toml" },
  { at = 22.0, dur = 2.0, media = "nibs", in = 70.07, media_v = "card_v", in_v = 0.0, label = 'eye = { anchor = "black-stage:subject" }', tag = "a character card on the black stage  ·  nibs-vs-duke s29" },
  { at = 24.0, dur = 2.0, media = "keynote", in = 5.5, media_v = "presenter_v", in_v = 0.08, label = 'kind = "mannequin", skin = "skins/ana.png"', tag = "a player-shaped actor, waving on cue  ·  trailer/footage" },
  { at = 26.0, dur = 2.0, media = "nibs", in = 65.3, media_v = "challenge_v", in_v = 0.03, label = 'do = "say", actor = "nibs", text = "I *challenge…"', tag = "a voiced line, captioned word by word  ·  nibs-vs-duke s28" },
]

[[scene]]
type = "split"
from = 28.0
to = 32.2
