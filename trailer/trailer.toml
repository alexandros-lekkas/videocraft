# The videocraft launch trailer: timeline, data sources and the trailer's own takes. trailer/README.md says how.

seconds = 60.0
fps = 60
poster = 56.6

# ---------------------------------------------------------------- the trailer's own takes (trailer/footage.py)
# Footage the finished runs do not have, filmed by videocraft, each with the game's own captions.

[[footage.take]]
name = "keynote"
script = "trailer/footage/keynote.toml"

[[footage.take]]
name = "panorama"
script = "trailer/footage/panorama.toml"

[[footage.take]]
name = "build"
run = "trailer-build"
set = "keynote-stage"
at = [0, 230, 0]
staged = 7
order = [[16, 17], [12, 15], [18, 33], [41, 46], [47, 59], [119, 131], [34, 40], [99, 118], [7, 10]]
start = 0.6
span = 5.6
duration = 7.5
camera = '{ rig = "dolly", from = [0.5, 262.0, 46.0], to = [0.5, 252.0, 30.0], at = [0.5, 233.0, -8.0], ease = "smooth", fov = 62 }'
caption = [{ shot = "build", at = 0.8, text = "Building *keynote-stage, block by block." }]

[[footage.take]]
name = "bees"
from = "examples/bees.toml"
run = "trailer-bees"
caption = [
  { shot = "swarm", at = 0.5, text = "Oh. Hi, *bees.", speaker = "Ben", color = "#9fe0a0" },
  { shot = "swarm", at = 5.7, text = "Okay. *Angry bees.", speaker = "Ben", color = "#9fe0a0" },
]

# ---------------------------------------------------------------- the piece

[exports]
h = "videocraft-trailer-1080p60.mp4"
v = "videocraft-trailer-9x16.mp4"
poster = "videocraft-trailer-poster.png"

# Deep warm charcoal, warm off-white type, one accent: the grass green of the videocraft block.
[colors]
bg = "#141312"
bg2 = "#1d1b19"
panel = "#1c1b19"
panel2 = "#23221f"
line = "#34312d"
text = "#f2eee6"
muted = "#a39d93"
dim = "#57534c"
accent = "#86d36a"
warn = "#e06c5a"

# Captured output and measured data (trailer/data/, written by `make.py capture` from the commands in README.md).
[data]
story = "story-show.txt"
gamelog = "game-log.txt"
make = "make.txt"
run = "run-story2.txt"
voice = "voice-nibs.json"
voice_check = "voice-check.txt"
review = "review.json"

# Footage, under runs/ (README.md: which runs, and how each was made). *_v: the tool's own 9:16 re-frames.
[media]
marks = "fu-marks/0006/take/shots/wide/video.mp4"
barn_build = "fu-build-barn-stage/0003/take/shots/build/video.mp4"
pano = "trailer-panorama/0001/cut/master.mp4"
nibs_v_s04 = "nibs-vs-duke/0012/clips/r2/short-1080x1920.mp4"
story = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/cut/master.mp4"
story_v = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/clips/r1/short-1080x1920.mp4"
nibs = "nibs-vs-duke/0012/cut/x-1080p60-original-audio.mp4"
short = "nibs-vs-duke/0012/clips/r1/short-1080x1920.mp4"
lane_v = "nibs-vs-duke/0012/clips/r2/short-1080x1920.mp4"
barn_v = "nibs-vs-duke/0012/clips/r3/short-1080x1920.mp4"
card_v = "nibs-vs-duke/0012/clips/r4/short-1080x1920.mp4"
challenge_v = "nibs-vs-duke/0012/clips/r5/short-1080x1920.mp4"
bees = "trailer-bees/0001/cut/master.mp4"
bees_v = "trailer-bees/0001/clips/r1/short-1080x1920.mp4"
keynote = "trailer-keynote/0002/cut/master.mp4"
hall_v = "trailer-keynote/0002/clips/r1/short-1080x1920.mp4"
presenter_v = "trailer-keynote/0002/clips/r2/short-1080x1920.mp4"
talk = "talk/0001/cut/master.mp4"
build = "trailer-build/0001/cut/master.mp4"
build_v = "trailer-build/0001/clips/r1/short-1080x1920.mp4"
story_walk_v = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/clips/r2/short-1080x1920.mp4"
hall_dolly_v = "trailer-keynote/0002/clips/r3/short-1080x1920.mp4"

# The story, in the game's own look: you ask the agent in the game's chat; the chat closes on the world it becomes;
# the agent films it (REC as a boss bar, the script line as a toast, the camera on a held map); a voiced line with
# the game's subtitle box; the edit over the film scrubbing; the reviewers' scores as boss bars and the climb's toast;
# the finished film; the end over the same lane at dusk. One world throughout: Nibs vs Duke's market lane and barn.

[[scene]]
type = "mcchat"
from = 0.0
to = 5.1
bg = { media = "pano", in = 2.0 }
prompt = "a one-horned goat challenges the three-time Talent Night champion, a snow fox, to a jump-off"
type_at = 0.3
cps = 44
send_at = 2.55
close_at = 4.9
lines = [
  { t = 2.85, mc = "§f<agent> On it: the story first, then I film it." },
  { t = 3.25, data = "story", match = '^STORY' },
  { t = 3.45, data = "story", match = '^  premise ', cut = 20 },
  { t = 3.65, data = "story", match = '^  bible ', cut = 20 },
  { t = 3.95, text = "$ bin/videocraft run examples/nibs-vs-duke.toml" },
  { t = 4.35, data = "gamelog", match = 'shot s01-nibs recording at', strip = '^.*\(videocraft\) ' },
]

[[scene]]
type = "mcmonitor"
from = 5.0
to = 25.1
clips = [
  { at = 5.0, dur = 3.6, media = "barn_build", in = 0.3, step = 2, shot_dir = "fu-build-barn-stage/0003/take/shots/build", icon = "oak_sign", toast_title = "barn-stage", toast = ['[[world.set]] name = "barn-stage"', 'built on camera, block by block'], toast_v = ['[[world.set]]', '"barn-stage"'] },
  { at = 8.6, dur = 2.6, media = "marks", in = 3.0, step = 2, shot_dir = "fu-marks/0006/take/shots/wide", icon = "name_tag", toast_title = "five actors, five marks", toast = ['do = "walk"', 'face = "camera"'] },
  { at = 11.2, dur = 2.4, media = "nibs", in = 9.9, run = "nibs-vs-duke/0012", icon = "writable_book", toast_title = "s04-market", toast = ['rig = "lead"', 'subject = "nibs"', 'fov = 108'] },
  { at = 13.6, dur = 2.0, media = "nibs", in = 22.65, run = "nibs-vs-duke/0012", icon = "writable_book", toast_title = "s08-poster", toast = ['view = "market-lane', ':poster"'] },
  { at = 15.6, dur = 2.2, media = "nibs", in = 32.0, run = "nibs-vs-duke/0012", icon = "writable_book", toast_title = "s12-note", toast = ['rig = "fixed"', 'barn-stage:note-1'] },
  { at = 17.8, dur = 2.4, media = "nibs", in = 37.1, run = "nibs-vs-duke/0012", icon = "writable_book", toast_title = "s14-notes", toast = ['[[edit.look]] frame = { color = "#e8a23a" }'], toast_v = ['[[edit.look]]', 'an amber frame'] },
  { at = 20.2, dur = 2.4, media = "nibs", in = 50.4, run = "nibs-vs-duke/0012", icon = "egg", toast_title = "s17-egg", toast = ['do = "emit"', 'actor = "hen-2"'] },
  { at = 22.6, dur = 2.5, media = "nibs", in = 55.8, run = "nibs-vs-duke/0012", icon = "writable_book", toast_title = "s19-jump", toast = ['rig = "lead"', 'subject = "nibs"'] },
]

[[scene]]
type = "mcvoice"
from = 25.0
to = 30.1
clip = { media = "nibs", in = 0.0 }
offset = 0.0
box_title = "Subtitles: Nibs (qwen3, voice ryan)"
box_title_v = "Nibs, word by word"
shot = "s01-nibs"

[[scene]]
type = "mcedit"
from = 30.0
to = 40.1
media = "nibs"
title = "§fcut/timeline.json §7nibs-vs-duke 0012: 34 clips, 76.87 s"
title_v = "§ftimeline.json §734 clips"
step = 8
slide_at = 30.1
lanes_at = 31.3
scrub_at = 31.0
scrub_dur = 9.0

[[scene]]
type = "mcscores"
from = 40.0
to = 45.1
clip = { media = "nibs", in = 25.2 }
toast_title = "Climb: kept the better take"
toast = ["average 6.50 -> 6.61 (+0.11)", "best of 9 review rounds"]
toast_v = ["6.50 -> 6.61", "(+0.11), kept"]
toast_at = 43.0

[[scene]]
type = "mcfilm"
from = 45.0
to = 55.0
clip = { media = "nibs", in = 59.4, media_v = "short", in_v = 3.9 }

[[scene]]
type = "mcend"
from = 55.0
to = 60.0
clip = { media = "pano", in = 23.5 }
name = "videocraft"
tagline = "Agent-directed films, shot inside Minecraft."
tagline_v = "Agent-directed films,\nshot inside Minecraft."
command = '$ bin/videocraft make "<prompt>"'
url = "github.com/alexandros-lekkas/videocraft"
url_v = "github.com/\nalexandros-lekkas/\nvideocraft"
disclaimer = "Unofficial. Not affiliated with Mojang or Microsoft."
disclaimer_v = "Unofficial. Not affiliated\nwith Mojang or Microsoft."

# ---------------------------------------------------------------- sound
# An original bed (videocraft audio synth), stems faded by section; original library sounds; the two voiced lines
# of runs/talk/0001. No Mojang audio anywhere. make.py adds the typing, node, tick and check sounds from the scenes.
[audio]
lufs = -14.0
ceiling = -1.5
# The main sound track is the game's own: music picked from the mood map, the GUI's sounds, the film's own mix.
# The `-original-audio` twin swaps each for an original one (synth bed, library sounds, the film's original mix).
mood = "upbeat"
style = "keynote"
bpm = 120
seed = 7
film = [
  { t = 25.0, start = 0.0, dur = 5.1, db = 0.0 },
  { t = 45.0, start = 59.4, dur = 10.0, db = 0.0 },
]
film_game = "runs/nibs-vs-duke/0012/cut/x-1080p60.mp4"
film_original = "runs/nibs-vs-duke/0012/cut/x-1080p60-original-audio.mp4"
music = [[0.0, -60], [0.3, -7], [4.9, -7], [5.0, -1], [24.8, -1], [25.0, -16], [29.9, -16], [30.0, -3], [44.8, -3], [45.0, -60], [54.9, -60], [55.0, -4], [59.0, -4], [60.0, -60]]
