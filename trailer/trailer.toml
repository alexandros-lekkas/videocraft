# The videocraft launch trailer: timeline, data sources and the trailer's own takes. trailer/README.md says how.

seconds = 66.0
fps = 60
poster = 59.4

# ---------------------------------------------------------------- the trailer's own takes (trailer/footage.py)
# Footage the finished runs do not have, filmed by videocraft, each with the game's own captions.

[[footage.take]]
name = "keynote"
script = "trailer/footage/keynote.toml"

[[footage.take]]
name = "build"
run = "trailer-build"
set = "keynote-stage"
at = [0, 230, 0]
staged = 7
order = [[16, 17], [12, 15], [18, 33], [41, 46], [47, 59], [119, 131], [34, 40], [99, 118], [7, 10]]
start = 0.6
span = 5.6
duration = 7.5
camera = '{ rig = "dolly", from = [0.5, 262.0, 46.0], to = [0.5, 252.0, 30.0], at = [0.5, 233.0, -8.0], ease = "smooth", fov = 62 }'
caption = [{ shot = "build", at = 0.8, text = "Building *keynote-stage, block by block." }]

[[footage.take]]
name = "bees"
from = "examples/bees.toml"
run = "trailer-bees"
caption = [
  { shot = "swarm", at = 0.5, text = "Oh. Hi, *bees.", speaker = "Ben", color = "#9fe0a0" },
  { shot = "swarm", at = 5.7, text = "Okay. *Angry bees.", speaker = "Ben", color = "#9fe0a0" },
]

# ---------------------------------------------------------------- the piece

[exports]
h = "videocraft-trailer-1080p60.mp4"
v = "videocraft-trailer-9x16.mp4"
poster = "videocraft-trailer-poster.png"

# Deep warm charcoal, warm off-white type, one accent: the grass green of the videocraft block.
[colors]
bg = "#141312"
bg2 = "#1d1b19"
panel = "#1c1b19"
panel2 = "#23221f"
line = "#34312d"
text = "#f2eee6"
muted = "#a39d93"
dim = "#57534c"
accent = "#86d36a"
warn = "#e06c5a"

# Captured output and measured data (trailer/data/, written by `make.py capture` from the commands in README.md).
[data]
make = "make.txt"
run = "run-story2.txt"
voice = "voice-nibs.json"
voice_check = "voice-check.txt"
review = "review.json"

# Footage, under runs/ (README.md: which runs, and how each was made). *_v: the tool's own 9:16 re-frames.
[media]
story = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/cut/master.mp4"
story_v = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/clips/r1/short-1080x1920.mp4"
nibs = "nibs-vs-duke/0012/cut/x-1080p60-original-audio.mp4"
short = "nibs-vs-duke/0012/clips/r1/short-1080x1920.mp4"
lane_v = "nibs-vs-duke/0012/clips/r2/short-1080x1920.mp4"
barn_v = "nibs-vs-duke/0012/clips/r3/short-1080x1920.mp4"
card_v = "nibs-vs-duke/0012/clips/r4/short-1080x1920.mp4"
challenge_v = "nibs-vs-duke/0012/clips/r5/short-1080x1920.mp4"
bees = "trailer-bees/0001/cut/master.mp4"
bees_v = "trailer-bees/0001/clips/r1/short-1080x1920.mp4"
keynote = "trailer-keynote/0002/cut/master.mp4"
hall_v = "trailer-keynote/0002/clips/r1/short-1080x1920.mp4"
presenter_v = "trailer-keynote/0002/clips/r2/short-1080x1920.mp4"
talk = "talk/0001/cut/master.mp4"
build = "trailer-build/0001/cut/master.mp4"
build_v = "trailer-build/0001/clips/r1/short-1080x1920.mp4"
story_walk_v = "a-goat-challenges-a-fox-to-a-jump-off-2/0002/clips/r2/short-1080x1920.mp4"
hall_dolly_v = "trailer-keynote/0002/clips/r3/short-1080x1920.mp4"

# The story: you ask an agent in a chat; it drafts and films the film inside a hidden Minecraft; it edits, reviews
# and climbs; the finished film plays; the command line and the repo. Sections overlap so no frame is empty.

[[scene]]
type = "chat"
from = 0.0
to = 8.7
title = "agent"
subtitle = "new chat"
agent_name = "agent"
placeholder = "Ask the agent to make something…"
prompt = "make a 60-second comedy short: a goat challenges a fox to a jump-off"
type_at = 0.5
cps = 24
send_at = 3.6
cut_at = 8.0
focus = "recording at"
messages = [
  { kind = "text", t = 3.95, text = "On it. I'll draft the story with videocraft, then film it in a hidden game." },
  { kind = "tool", t = 4.7, lines = [
    { t = 4.7, text = '$ bin/videocraft make "a goat challenges a fox to a jump-off" --dry-run' },
    { t = 5.0, match = '^STORY' },
    { t = 5.25, match = '^STAGE\s+premise' },
    { t = 5.45, match = '^STAGE\s+bible' },
    { t = 5.65, match = '^STAGE\s+outline' },
    { t = 5.85, match = '^STAGE\s+script' },
    { t = 6.05, match = '^STAGE\s+shots' },
    { t = 6.3, match = '^RESULT\s+PASS shots.toml' },
  ] },
  { kind = "tool", t = 6.8, lines = [
    { t = 6.8, text = "$ bin/videocraft run stories/a-goat-challenges-a-fox-to-a-jump-off-2/shots.toml" },
    { t = 7.2, data = "run", match = '^videocraft \d.*hidden' },
    { t = 7.6, data = "run", match = 'shot s01-wide recording at' },
  ] },
]

[[scene]]
type = "monitor"
from = 8.1
to = 23.5
clock = "fixed 1/60 s clock · the game's own framebuffer"
map_title = "top view"
map_legend = "camera (frames.csv) · actors (actors.csv)"
clips = [
  { at = 8.1, dur = 3.7, media = "build", in = 0.0, step = 2, media_v = "build_v", in_v = 0.0, run = "trailer-build/0001", intro = 0.55, intro_from = "chat", label = '[[world.set]] name = "keynote-stage"', tag = "the set going up, its own build commands on camera (2x)", label_v = '[[world.set]] name = "keynote-stage"', tag_v = "the set going up, block by block (2x)" },
  { at = 11.8, dur = 3.4, media = "story", in = 1.0, media_v = "story_walk_v", in_v = 0.2, run = "a-goat-challenges-a-fox-to-a-jump-off-2/0002", label = 'do = "walk", actor = "lugnut", path = [[17.5, 230, -8.5], …]', label_v = 'do = "walk", actor = "lugnut"', tag = "the goat walks to his mark  ·  the film from that prompt, s01" , tag_v = "to his mark  ·  the film from that prompt" },
  { at = 15.2, dur = 3.0, media = "keynote", in = 0.3, media_v = "hall_dolly_v", in_v = 0.3, run = "trailer-keynote/0002", label = 'camera = { rig = "dolly", from = [0.5, 241, 21.5], … }', label_v = 'camera = { rig = "dolly", … }', tag = "the camera flies down the aisle  ·  trailer/footage/keynote.toml", tag_v = "the camera flies down the aisle" },
  { at = 18.2, dur = 2.6, media = "nibs", in = 1.6, media_v = "lane_v", in_v = 0.0, run = "nibs-vs-duke/0012", label = 'camera = { rig = "lead", subject = "nibs", fov = 108 }', tag = "a lead track down the market lane  ·  nibs-vs-duke s01", tag_v = "a lead track  ·  nibs-vs-duke s01" },
  { at = 20.8, dur = 2.7, media = "bees", in = 22.9, media_v = "bees_v", in_v = 0.08, run = "trailer-bees/0001", label = 'do = "swarm", around = "ben", angry = true', tag = "five bees on scripted paths  ·  examples/bees.toml", tag_v = "five scripted bees  ·  examples/bees.toml" },
]

[[scene]]
type = "voice"
from = 23.3
to = 29.2
header = "Local voices. Captions pop on each word."
header_v = "Local voices. Captions\npop on each word."
media = "talk"
in = 0.0
media_at = 23.6
media_len = 3.65
voice_at = 23.6
label = "do = \"say\", actor = \"nibs\", text = \"Hey. It's me. *Nibs. …\""
line_info = "{engine} · voice {voice} · aligned word by word"
title = "voice check"
check_command = "bin/videocraft voice check talk"
check_at = 26.9
check_step = 0.4
check = ['^CAPTION\s+nibs-1', '^VOICE\s+nibs-1', '^RESULT']

[[scene]]
type = "timeline"
from = 29.0
to = 40.0
header = "Then it edits: cuts on words, music under every line."
header_v = "Then it edits: cuts on\nwords, music under lines."
media = "nibs"
media_label = "nibs-vs-duke 0012"
step = 15
slide_at = 29.8
lanes_at = 31.6
scrub_at = 32.6
scrub_dur = 6.0

[[scene]]
type = "review"
from = 39.8
to = 49.1
header = "Reviewed by agents. Kept only if it scores higher."
header_v = "Reviewed by agents.\nKept if it scores higher."
card_title = "nibs-vs-duke · 0012"
card_sub = "6 reviewer agents · rubric pinksheep-style"
average_label = "average"
pass_note = "pass is 7.0: not there yet"
chart_title = "the climb"
chart_sub = "each review round · the best so far, kept"
pass_label = "pass 7.0"
best_label = "best 6.61, +0.11"
x_label = "review round"
y_min = 6.2
y_max = 7.0
y_step = 0.2
per = 0.28
quote_at = 45.0
quote = "“Every word starts exactly on its cut frame …\nThis is the best-cut stretch in the film.”"
quote_v = "“Every word starts exactly on its\ncut frame … This is the best-cut\nstretch in the film.”"
quote_by = "the pacing reviewer, round 9, on the montage"

[[scene]]
type = "footage"
from = 48.9
to = 56.3
clips = [
  { at = 48.9, dur = 7.4, media = "nibs", in = 55.52, media_v = "short", in_v = 0.02, intro = 0.6, label = "nibs-vs-duke  ·  the finished film", tag = "the same premise, climbed for 12 iterations: voiced, scored, cut on words", tag_v = "the same premise, after 12 iterations" },
]

[[scene]]
type = "end"
from = 56.1
to = 66.0
name = "videocraft"
tagline = "Shot script in. Filmed video out."
tagline_v = "Shot script in.\nFilmed video out."
url = "github.com/alexandros-lekkas/videocraft"
command = '$ bin/videocraft make "<prompt>"'
disclaimer = "Unofficial. Not affiliated with Mojang or Microsoft."
disclaimer_v = "Unofficial. Not affiliated\nwith Mojang or Microsoft."

[[chapter]]
from = 29.2
to = 39.6
n = "03"
text = "edit"

[[chapter]]
from = 39.9
to = 48.7
n = "04"
text = "review"

# ---------------------------------------------------------------- sound
# An original bed (videocraft audio synth), stems faded by section; original library sounds; the two voiced lines
# of runs/talk/0001. No Mojang audio anywhere. make.py adds the typing, node, tick and check sounds from the scenes.
[audio]
style = "keynote"
bpm = 120
seed = 7
lufs = -14.0
ceiling = -1.5
type_db = -16.0
voice = [
  { t = 23.9, file = "cache/voice/lines/b7692ba27f26d4478460.pf04ab922d5ee.wav", db = 4.0 },
]
