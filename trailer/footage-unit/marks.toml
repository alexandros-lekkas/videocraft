# Footage unit: the actors go to their marks in front of the barn that went up in build-barn-stage.toml.
#   bin/videocraft run trailer/footage-unit/marks.toml
# Yellow carpet squares in the yard are the tape marks. The barn's doorway stands open; the goat, the fox and three
# hens come out of the barn one after another, each walks onto its own mark and turns to the lens, while a mannequin
# director at the side points them in. Two shots: a locked wide from high in the yard, a lead track on the goat.
name = "fu-marks"
seed = 5
description = "The cast walks to its tape marks in front of the barn; a locked wide and a lead track"

[world]
seed = "videocraft"
time = 11000

[[world.set]]
name = "barn-stage"
at = [0, 230, 0]

[[world.stage]]
do = "command"
commands = [
  "fill 12 230 -1 12 231 0 air strict",
  "fill 13 230 -12 31 231 9 air replace minecraft:tall_grass strict",
  "fill 13 230 -12 31 230 9 air replace minecraft:short_grass strict",
  "setblock 19 230 -4 yellow_carpet strict",
  "setblock 19 230 2 yellow_carpet strict",
  "setblock 22 230 -6 yellow_carpet strict",
  "setblock 22 230 -1 yellow_carpet strict",
  "setblock 22 230 4 yellow_carpet strict",
]

[[actor]]
id = "nibs"
kind = "mob"
entity = "goat"
at = [10.8, 230, 0.0]
facing = -90
left_horn = false
tint = "#8c9fc2"

[[actor]]
id = "duke"
kind = "mob"
entity = "fox"
variant = "snow"
at = [9.6, 230, 0.4]
facing = -90

[[actor]]
id = "hen-1"
kind = "mob"
entity = "chicken"
at = [10.6, 230, -0.6]
facing = -90

[[actor]]
id = "hen-2"
kind = "mob"
entity = "chicken"
at = [9.4, 230, -0.5]
facing = -90

[[actor]]
id = "hen-3"
kind = "mob"
entity = "chicken"
at = [8.6, 230, 0.3]
facing = -90

[[actor]]
id = "director"
kind = "mannequin"
skin = "../../examples/skins/ben.png"
at = [20.5, 230, -7.2]
facing = 20

# A locked wide from the yard: the open doors at left, the five marks, the director at the right edge.
[[shot]]
name = "wide"
duration = 10.0
camera = { rig = "fixed", eye = [27.5, 232.9, 3.2], at = [18.5, 231.0, -1.6], fov = 62 }

[[shot.cue]]
at = 0.2
do = "walk"
actor = "nibs"
speed = 1.9
path = [[14.5, 230, 0.0], [17.5, 230, -2.6], [19.5, 230, -3.5]]
face = "camera"

[[shot.cue]]
at = 0.9
do = "walk"
actor = "duke"
speed = 2.3
path = [[14.5, 230, 0.6], [17.8, 230, 2.0], [19.5, 230, 2.5]]
face = "camera"

[[shot.cue]]
at = 0.7
do = "walk"
actor = "hen-1"
speed = 2.1
path = [[14.2, 230, -0.6], [19.0, 230, -4.8], [22.5, 230, -5.5]]
face = "camera"

[[shot.cue]]
at = 1.0
do = "walk"
actor = "hen-2"
speed = 2.1
path = [[14.2, 230, -0.2], [19.5, 230, -0.6], [22.5, 230, -0.5]]
face = "camera"

[[shot.cue]]
at = 1.3
do = "walk"
actor = "hen-3"
speed = 2.1
path = [[14.2, 230, 0.4], [19.0, 230, 3.4], [22.5, 230, 4.5]]
face = "camera"

[[shot.cue]]
at = 0.0
do = "look"
actor = "director"
target = "nibs"
hold = 2.5

[[shot.cue]]
at = 0.8
do = "pose"
actor = "director"
pose = "point"
seconds = 2.0

[[shot.cue]]
at = 3.0
do = "look"
actor = "director"
target = "hen-3"
hold = 3.0

[[shot.cue]]
at = 8.0
do = "pose"
actor = "director"
pose = "cheer"
