# A lead track on the goat as he comes out of the barn's doorway and crosses to his mark.
[[shot]]
name = "lead"
duration = 5.0
preroll = 0.4
camera = { rig = "lead", subject = "nibs", distance = 3.4, height = 1.1, pitch = 6, fov = 90, side = 0.5 }

[[shot.cue]]
at = -0.4
do = "place"
actor = "nibs"
to = [12.3, 230, 0.0]
facing = -90

[[shot.cue]]
at = -0.4
do = "walk"
actor = "nibs"
speed = 1.6
path = [[14.5, 230, 0.0], [17.5, 230, -2.4], [19.5, 230, -3.5]]
face = "camera"
