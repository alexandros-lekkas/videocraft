[[actor]]
id = "director"
kind = "mannequin"
skin = "../../examples/skins/ben.png"
at = [24.8, 230, -7.3]
facing = 70

[[shot]]
name = "flyin"
duration = 7.0
camera = { rig = "dolly", from = [27.0, 263.0, 21.0], to = [29.0, 232.6, 4.0], at = [20.5, 231.0, -1.8], ease = "smooth", fov = [72, 56] }

[[shot.cue]]
at = 0.0
do = "look"
actor = "nibs"
target = "duke"
hold = 2.5

[[shot.cue]]
at = 3.0
do = "look"
actor = "duke"
target = "nibs"
hold = 2.0

[[shot.cue]]
at = 5.2
do = "turn"
