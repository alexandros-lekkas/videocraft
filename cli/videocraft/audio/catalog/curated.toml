# Hand curation for the generated catalogs. `videocraft audio catalog --refresh` reads this file and the local game
# assets and writes minecraft.toml and music.toml next to it; edit this file (not the generated ones) and refresh.
#
#   [best]          per tag: the Minecraft events to prefer, in order, when a script asks for that tag
#   [palette.*]     the comedy palette: named effects mapped to the best real Minecraft event(s), with pitch and
#                   volume suggestions, and the original library sound that replaces them in original-only exports
#   [music."<file>"] moods (first is the main one), vocals, a note; tempo, starts and loops are measured
#
# Palette entries:  pick = [{ id, pitch, volume, note }]  alternatives, the first is the default (a pitch [lo, hi]
#                                                          is a seeded choice in that range)
#                   sequence = [{ at, id, pitch, volume }]  every step plays, `at` seconds after the cue
#                   roll = { id, seconds, rate, crescendo, pitch, jitter, volume, end = [{ at, id, pitch, volume }] }
#                          a run of hits at `rate` per second, swelling when crescendo, with seeded jitter in time
#                   original = "<library sound>"            the stand-in in an original-only export (played once)
# The ids were chosen from the event names, the curated meanings and the measured lengths in minecraft.toml; nobody
# listened to them while writing this (the catalog is built by an agent that cannot hear). Re-rank by ear.

[best]
pop = ["entity.item.pickup", "ui.hud.bubble_pop", "block.bubble_column.bubble_pop", "block.lava.pop"]
plop = ["entity.chicken.egg", "block.sniffer_egg.plop", "entity.turtle.lay_egg", "entity.frog.lay_spawn"]
ding = ["entity.experience_orb.pickup", "block.note_block.bell", "entity.arrow.hit_player", "entity.player.levelup", "block.bell.use"]
boing = ["entity.slime.jump", "block.shelf_mushroom.bounce", "entity.sulfur_cube.bounce", "entity.magma_cube.jump", "entity.slime.jump_small"]
whoosh = ["entity.player.attack.sweep", "entity.breeze.wind_burst", "item.trident.throw", "entity.ender_pearl.throw", "ui.toast.in"]
swish = ["entity.player.attack.sweep", "entity.player.attack.nodamage", "entity.fishing_bobber.throw"]
click = ["ui.button.click", "block.wooden_button.click_on", "block.lever.click", "block.stone_button.click_on"]
impact = ["block.anvil.land", "entity.goat.ram_impact", "item.mace.smash_ground_heavy", "entity.player.attack.strong", "entity.zombie.attack_wooden_door"]
bonk = ["entity.player.attack.strong", "entity.zombie.attack_wooden_door", "entity.goat.ram_impact", "block.anvil.land"]
thud = ["entity.generic.small_fall", "entity.player.small_fall", "entity.armor_stand.fall", "entity.generic.big_fall"]
explosion = ["entity.generic.explode", "entity.firework_rocket.large_blast", "entity.dragon_fireball.explode"]
splash = ["entity.generic.splash", "entity.player.splash.high_speed", "entity.player.splash", "entity.fishing_bobber.splash"]
fail = ["entity.villager.no", "block.fire.extinguish", "entity.item.break", "block.note_block.didgeridoo", "block.crafter.fail"]
error = ["block.crafter.fail", "block.dispenser.fail", "block.chest.locked", "entity.villager.no"]
success = ["ui.toast.challenge_complete", "entity.player.levelup", "entity.villager.yes"]
levelup = ["entity.player.levelup"]
sparkle = ["entity.firework_rocket.twinkle", "block.amethyst_block.chime", "block.enchantment_table.use"]
magic = ["block.enchantment_table.use", "entity.evoker.cast_spell", "entity.illusioner.cast_spell", "item.totem.use"]
teleport = ["entity.enderman.teleport", "item.chorus_fruit.teleport", "entity.shulker.teleport"]
