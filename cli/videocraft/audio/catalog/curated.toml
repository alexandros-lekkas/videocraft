hmm = ["entity.villager.ambient", "entity.villager.trade", "entity.wandering_trader.ambient"]
yes = ["entity.villager.yes", "entity.wandering_trader.yes"]
no = ["entity.villager.no", "entity.wandering_trader.no"]
scream = ["entity.goat.screaming.ambient", "entity.goat.screaming.hurt", "entity.fox.screech", "entity.enderman.scream", "entity.ghast.scream"]
