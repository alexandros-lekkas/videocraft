# ---- the comedy palette ----

[palette.boing]
about = "a cartoon spring bounce"
original = "boing"
pick = [{ id = "entity.slime.jump", pitch = [1.05, 1.25], note = "the slime's squelchy hop, pitched up" },
        { id = "block.shelf_mushroom.bounce" }, { id = "entity.magma_cube.jump", pitch = 1.3 }]

[palette.pop]
about = "a small bright pop: something appears or is picked up"
original = "pop"
pick = [{ id = "entity.item.pickup", pitch = [1.3, 1.8], note = "the item pickup pop" }, { id = "ui.hud.bubble_pop" },
        { id = "block.bubble_column.bubble_pop" }]

[palette.plop]
about = "something soft drops out: an egg, a blob"
original = "plop"
pick = [{ id = "entity.chicken.egg", pitch = [0.9, 1.1], note = "the chicken laying an egg" }, { id = "block.sniffer_egg.plop" },
        { id = "entity.turtle.lay_egg" }]

[palette.ding]
about = "a bright ding: correct, idea, reward"
original = "ding"
pick = [{ id = "entity.experience_orb.pickup", pitch = [0.9, 1.1], note = "the XP ding" },
        { id = "block.note_block.bell", pitch = 1.0, volume = 0.8 }, { id = "entity.arrow.hit_player" }]

[palette.levelup]
about = "the level-up jingle: a win"
original = "level-up"
pick = [{ id = "entity.player.levelup" }]

[palette.success]
about = "a small victory"
original = "success-chime"
pick = [{ id = "ui.toast.challenge_complete", volume = 0.8, note = "the advancement fanfare" }, { id = "entity.player.levelup" }]

[palette.ta-da]
about = "ta-da: a rising note-block arpeggio"
original = "fanfare"
sequence = [{ at = 0.0, id = "block.note_block.pling", pitch = 1.0 }, { at = 0.09, id = "block.note_block.pling", pitch = 1.26 },
            { at = 0.18, id = "block.note_block.pling", pitch = 1.498 }, { at = 0.3, id = "block.note_block.pling", pitch = 2.0 },
            { at = 0.3, id = "block.note_block.bell", pitch = 1.0, volume = 0.6 }]

[palette.fail]
about = "it did not work"
original = "fail-trombone"
pick = [{ id = "entity.villager.no", note = "the villager's grumpy hrmm" }, { id = "block.fire.extinguish", note = "a fizzle" },
        { id = "entity.item.break", note = "a tool breaking" }]

[palette.wah-wah]
about = "the sad trombone, on note blocks: four falling didgeridoo notes"
original = "fail-trombone"
sequence = [{ at = 0.0, id = "block.note_block.didgeridoo", pitch = 0.841 }, { at = 0.36, id = "block.note_block.didgeridoo", pitch = 0.794 },
            { at = 0.72, id = "block.note_block.didgeridoo", pitch = 0.749 }, { at = 1.08, id = "block.note_block.didgeridoo", pitch = 0.707 },
            { at = 1.08, id = "block.note_block.bass", pitch = 0.707, volume = 0.7 }]

[palette.error]
about = "denied: a wrong button"
original = "error-buzz"
pick = [{ id = "block.crafter.fail" }, { id = "block.dispenser.fail" }, { id = "block.chest.locked" }]

[palette.drumroll]
about = "a drumroll before a reveal (note-block snares, swelling, ending on a kick and a snare)"
original = "snare-roll"
roll = { id = "block.note_block.snare", seconds = 1.7, rate = 22, crescendo = true, pitch = [0.95, 1.05], jitter = 0.1, volume = 0.7,
         end = [{ at = 0.0, id = "block.note_block.basedrum", pitch = 0.8, volume = 1.0 }, { at = 0.0, id = "block.note_block.snare", pitch = 0.9, volume = 1.0 },
                { at = 0.0, id = "block.note_block.hat", pitch = 0.7, volume = 0.8 }] }

[palette.rimshot]
