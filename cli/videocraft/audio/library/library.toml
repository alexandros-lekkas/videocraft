# The original sound library: every sound here is made by code (recipes.py), so it can go in any export.
# Tags use the same words as the Minecraft catalog (catalog/minecraft.toml), which is how an original-only export
# finds the stand-in for a Minecraft sound. `videocraft audio find <words>` searches both; `videocraft audio
# play-sheet <tag>` renders the candidates into one wav to listen to.

