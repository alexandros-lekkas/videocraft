# Sets: a script filmed in a set from sets/ (docs/SETS.md), placed by [[world.set]] and reached through its marks.
#   bin/videocraft run examples/sets.toml
# Nibs, the one-horned goat, walks up the market at the start of market-lane, then past the produce stall, on lead
# tracks at one block up with a 105° lens (the benchmark's framing), then a straight-on look at the Talent Night
# poster. Each walk follows one of the set's path marks and starts in the preroll, so the shot opens mid-stride.
name = "sets"
seed = 11
description = "A set from sets/, a goat walking its path marks on lead tracks, and a camera mark"

[world]
seed = "videocraft"

[[world.set]]
name = "market-lane"
at = [0, 230, 0]

[[actor]]
id = "nibs"
kind = "mob"
entity = "goat"
at = { anchor = "market-lane:shot-01" }
facing = -90                    # east, up the lane
left_horn = false               # one horn
tint = "#8c9fc2"                # slate blue-grey

[[shot]]
name = "market"
duration = 5.0
preroll = 1.0
camera = { rig = "lead", subject = "nibs", distance = 3.0, height = 1.0, pitch = 5, fov = 105 }

[[shot.cue]]
at = -1.0
do = "walk"
actor = "nibs"
speed = 1.6
path = { path = "market-lane:shot-01" }

[[shot]]
name = "produce"
duration = 4.0
preroll = 1.0
camera = { rig = "lead", subject = "nibs", distance = 3.0, height = 1.0, pitch = 5, fov = 105 }

[[shot.cue]]
at = -1.0
do = "place"
actor = "nibs"
to = { anchor = "market-lane:shot-04" }
facing = -90

[[shot.cue]]
at = -1.0
do = "walk"
actor = "nibs"
speed = 1.6
path = { path = "market-lane:shot-04" }

[[shot]]
name = "poster"
duration = 2.0
camera = { view = "market-lane:poster" }
