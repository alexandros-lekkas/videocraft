# The sound track: game sounds logged on their frames, a note-block tune, an ambience bed, sounds by meaning (tags and
# the comedy palette), music picked by mood with cues, a black gap. The muted game logs every sound to
# shots/<name>/sounds.csv; the mix rebuilds them from your own game assets, and the original-audio export swaps each
# one for its original library stand-in (docs/SOUNDS.md).
#   bin/videocraft run examples/sound.toml
#   bin/videocraft audio events sound --onsets        each event's onset in the mix against its frame
name = "sound"
seed = 7

[world]
seed = "videocraft"
time = 1000
weather = "clear"

# A lawn at spawn, a row of five note blocks on gold (bell), and a chicken that keeps still and quiet: its sounds
# are played by the script, on the frames they belong to.
[[world.stage]]
do = "command"
commands = [
    "execute at @p run fill ~-9 ~-1 ~-9 ~9 ~-1 ~9 minecraft:grass_block",
    "execute at @p run fill ~-9 ~ ~-9 ~9 ~8 ~9 minecraft:air",
    "execute at @p run fill ~-2 ~ ~4 ~2 ~ ~4 minecraft:gold_block",
    "execute at @p run fill ~-2 ~1 ~4 ~2 ~1 ~4 minecraft:note_block[instrument=bell]",
    "execute at @p run summon minecraft:chicken ~3.5 ~ ~1.5 {NoAI:1b,Silent:1b,Rotation:[150f,0f]}",
]

[[shot]]
name = "notes"
duration = 4.0
camera = { rig = "fixed", eye = { anchor = "spawn", offset = [0, 2.6, -1.2] }, at = { anchor = "spawn", offset = [0, 1.2, 4.5] }, fov = 70 }

# An original melody, one note per eighth at 140 bpm, walking along the five blocks; each note on its frame with
# the block's own bell sound and a note particle.
[[shot.cue]]
at = 0.25
do = "tune"
blocks = [{ anchor = "spawn", offset = [-2, 1, 4] }, { anchor = "spawn", offset = [-1, 1, 4] }, { anchor = "spawn", offset = [0, 1, 4] },
          { anchor = "spawn", offset = [1, 1, 4] }, { anchor = "spawn", offset = [2, 1, 4] }]
notes = "c4 e4 g4 c5 - g4 e4 c4*2 d4 f4 a4 d5*2"
mark = "note"                 # each note's frame in marks.json, for cuts on the beat
bpm = 140

[[shot.cue]]
at = 3.4
do = "sound"
id = "videocraft:ding"
relative = true
volume = 0.6

[[shot]]
name = "yard"
duration = 4.0
camera = { rig = "fixed", eye = { anchor = "spawn", offset = [6.5, 1.9, -2.5] }, at = { anchor = "spawn", offset = [3.5, 0.5, 1.5] }, fov = 60 }

[[shot.cue]]
at = 0.0
do = "ambience"
id = "videocraft:cricket"
pos = { anchor = "spawn", offset = [3, 0, 3] }
every = 0.4
spread = 4
volume = 0.5

[[shot.cue]]
at = 0.6
do = "sound"
id = "minecraft:entity.chicken.ambient"
pos = { anchor = "spawn", offset = [3.5, 0.4, 1.5] }

[[shot.cue]]
at = 1.2
do = "sound"
palette = "boing"             # the slime's hop, pitched up; the original export plays the library boing
pos = { anchor = "spawn", offset = [3.5, 0.4, 1.5] }

[[shot.cue]]
at = 2.0
do = "sound"
palette = "plop"              # the chicken laying an egg
pos = { anchor = "spawn", offset = [3.5, 0.2, 1.5] }

[[shot.cue]]
at = 2.0
do = "particles"
id = "minecraft:poof"
pos = { anchor = "spawn", offset = [3.5, 0.3, 1.5] }
count = 6
spread = 0.2

[[shot.cue]]
at = 3.1
do = "sound"
id = "minecraft:entity.chicken.ambient"
pos = { anchor = "spawn", offset = [3.5, 0.4, 1.5] }
pitch = 1.2

[[shot.cue]]
at = 3.5
do = "sound"
tag = "pop"                   # the best Minecraft sound tagged pop (the item pickup)
pos = { anchor = "spawn", offset = [3.5, 0.6, 1.5] }

# The reveal: a note-block drumroll, a villager cheer just after its last hit (not on it: it would be masked), a rimshot.
[[shot]]
name = "reveal"
duration = 4.5
camera = { rig = "fixed", eye = { anchor = "spawn", offset = [5.5, 1.6, -1.0] }, at = { anchor = "spawn", offset = [3.5, 0.6, 1.5] }, fov = 55 }

[[shot.cue]]
at = 0.1
do = "sound"
palette = "drumroll"
relative = true

[[shot.cue]]
at = 1.95
do = "particles"
id = "minecraft:happy_villager"
pos = { anchor = "spawn", offset = [3.5, 0.8, 1.5] }
count = 12
spread = 0.5

[[shot.cue]]
at = 1.95
do = "sound"
palette = "cheer"
relative = true

[[shot.cue]]
at = 3.3
do = "sound"
palette = "rimshot"
relative = true

[edit]
audio = "game"

[[edit.clip]]
shot = "notes"

[[edit.clip]]
black = 0.8

[[edit.clip]]
shot = "yard"

[[edit.clip]]
shot = "reveal"

# A game track picked by mood (source = "auto", the default): the music map's playful tracks, started at the track's
# measured entry; the original-audio export plays the synth bed in the playful style (comedy-chase) instead.
[edit.music]
mood = "playful"
gain = -2

# The bed thins to drums under the tune, comes back full, drops out for the egg and lands a hit at the end.
[[edit.music.cue]]
shot = "notes"
at = 0.2
do = "thin"

[[edit.music.cue]]
shot = "notes"
at = 3.4
do = "full"

[[edit.music.cue]]
shot = "yard"
at = 1.9
do = "drop"
length = 0.8

[[edit.music.cue]]
shot = "yard"
at = 3.5
do = "hit"

# A whoosh placed by the edit on the cut into the reveal (not logged by the take).
[[edit.sfx]]
shot = "reveal"
at = 0.0
palette = "whoosh"
gain = -4

[edit.mix]
duck = ["tag:plop", "tag:cheer"]

# Both sound tracks from one script: cut/x-1080p60.mp4 (game audio) and cut/x-1080p60-original-audio.mp4.
[[edit.export]]
preset = "x-1080p60"
audio = "original"
