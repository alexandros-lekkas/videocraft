# Nibs vs Duke: the benchmark film (docs/benchmarks/pinksheep-style.md). Thirty shots in about 72 s plus a 2 s end
# card, matching the form of the reference comedy short shot for shot, with our own characters: Nibs, a one-horned
# slate-blue goat; Duke, a snow fox; four chickens. Everything is staged and filmed in the game: the market-lane and
# barn-stage sets, Duke's card on black-stage, the poster, the captions and the cards. Voices come from the cast
# (cast/nibs-vs-duke.toml); without the voice installed the lines get estimated timings and no voice.
#   bin/videocraft lint examples/nibs-vs-duke.toml --rubric pinksheep-style
#   bin/videocraft run examples/nibs-vs-duke.toml
#   bin/videocraft review run nibs-vs-duke --rubric pinksheep-style
# Production log: docs/benchmarks/nibs-vs-duke-log.md.
name = "nibs-vs-duke"
seed = 11
description = "Nibs, a one-horned goat, struts down the market lane, sees that Duke the snow fox won Talent Night again, remembers last year's show, and challenges Duke to a jump-off. Duke goes to sleep."

[cast]
file = "cast/nibs-vs-duke.toml"

[world]
seed = "nibs-vs-duke"
preset = "void"
time = 11000
weather = "clear"
settle = 3.0

# Three sets far enough apart that no light or block of one shows in another.
[[world.set]]
name = "market-lane"
at = [0, 230, 0]

[[world.set]]
name = "barn-stage"
at = [0, 230, 170]

[[world.set]]
name = "black-stage"
at = [0, 230, -150]

# ---------------------------------------------------------------- the cast
[[actor]]
id = "nibs"
kind = "mob"
entity = "goat"
at = { anchor = "market-lane:shot-01" }
facing = -108
left_horn = false
screaming = true
tint = "#8c9fc2"

[[actor]]
id = "duke"
kind = "mob"
entity = "fox"
variant = "snow"
at = { anchor = "barn-stage:stage-center" }
facing = -90

[[actor]]
id = "hen-1"
kind = "mob"
entity = "chicken"
at = { anchor = "barn-stage:rail-1" }
facing = 90

[[actor]]
id = "hen-2"
kind = "mob"
entity = "chicken"
at = { anchor = "barn-stage:rail-2" }
facing = 40                     # three-quarter, so the egg drops in sight; its head turns to the lens

[[actor]]
id = "hen-3"
kind = "mob"
entity = "chicken"
at = { anchor = "barn-stage:rail-3" }
facing = 95

[[actor]]
id = "hen-4"
