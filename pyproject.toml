[project]
name = "videocraft"
version = "0.1.0"
description = "Agent-directed video for Minecraft Java: shot list in, cut video out."
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
videocraft = "videocraft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["cli"]
include = ["videocraft*"]
