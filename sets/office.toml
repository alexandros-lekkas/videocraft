# A small glass-and-concrete office in a green office park, midday: open desks with monitors, a meeting corner
# with a whiteboard, plants, ceiling lights. Generic: no company names or logos.
name = "office"
description = "A small glass-and-concrete office: desks and monitors, a meeting corner, a whiteboard"
time = 6000
weather = "clear"
biome = "minecraft:plains"
seed = 21

# ---------------------------------------------------------------- outside

[[build]]
do = "ground"
from = [-36, -30]
to = [36, 30]
mix = { grass_block = 1 }

[[build]]
do = "box"
from = [-14, -1, 10]
to = [14, -1, 18]
block = { smooth_stone = 3, light_gray_concrete = 1 }

[[build]]
do = "tree"
at = [[-20, 14], [20, 15], [-22, -16], [21, -18], [0, -22], [-28, 0], [28, 2]]
kind = "birch"

[[build]]
do = "bush"
at = [[-12, 11], [12, 11], [-16, -12], [16, -12]]
leaves = "azalea_leaves"

[[build]]
do = "scatter"
from = [-36, -30]
to = [36, 30]
blocks = { short_grass = 8, dandelion = 1, oxeye_daisy = 1 }
density = 0.2

[[build]]
do = "backdrop"
from = [-36, -30]
to = [36, 30]
width = 28
height = [4, 20]
roughness = 5
trees = { kinds = ["birch", "oak", "spruce"], density = 0.05 }

# ---------------------------------------------------------------- the building: concrete frame, glass walls

[[build]]
do = "shell"
from = [-12, -1, -8]
to = [12, 6, 8]
floor = { light_gray_concrete = 4, white_concrete = 1 }
walls = "light_gray_stained_glass_pane"
ceiling = "white_concrete"
base = "light_gray_stained_glass_pane"
posts = { every = 6, block = "smooth_stone" }

[[build]]
do = "box"
from = [-12, 6, -8]
to = [12, 6, 8]
block = "smooth_stone"
hollow = false

[[build]]
do = "box"
from = [-12, 7, -8]
to = [12, 7, 8]
block = "smooth_stone_slab[type=bottom]"

# The entrance: a glass door on the south side.
[[build]]
do = "blocks"
list = [
  [0, 0, 8, "iron_door[facing=south,half=lower,hinge=left,open=false]"], [0, 1, 8, "iron_door[facing=south,half=upper,hinge=left,open=false]"],
  [1, 0, 8, "iron_door[facing=south,half=lower,hinge=right,open=false]"], [1, 1, 8, "iron_door[facing=south,half=upper,hinge=right,open=false]"],
]

# A concrete back wall (north) with a whiteboard, so the meeting corner has something behind it.
[[build]]
do = "box"
from = [-12, 0, -8]
to = [12, 5, -8]
block = "white_concrete"

[[build]]
do = "poster"
at = [-10, 1, -8]
facing = "south"
size = [5, 3]
board = "white_concrete"
frame = "light_gray_concrete"
paper = "white_concrete"
lines = [
  { text = "Q3 ROADMAP", at = [2.5, 2.3], scale = 1.6, color = "#1d3b8a", bold = true },
  { text = "1. ship it", at = [2.5, 1.6], scale = 1.1, color = "#333333" },
  { text = "2. ship it again", at = [2.5, 1.2], scale = 1.1, color = "#333333" },
  { text = "3. ???", at = [2.5, 0.8], scale = 1.1, color = "#c0392b" },
]
mark = "whiteboard"
fov = 45

# ---------------------------------------------------------------- inside: desks, monitors, chairs

[[part]]
name = "desk"
# Faces south (the sitter faces north, toward the monitor). Two seats side by side.
[[part.build]]
do = "blocks"
list = [
  [0, 0, 0, "iron_bars"], [2, 0, 0, "iron_bars"],
  [0, 1, 0, "smooth_quartz_slab[type=bottom]"], [1, 1, 0, "smooth_quartz_slab[type=bottom]"], [2, 1, 0, "smooth_quartz_slab[type=bottom]"],
  [0, 0, 2, "dark_oak_stairs[facing=south,half=bottom]"], [2, 0, 2, "dark_oak_stairs[facing=south,half=bottom]"],
]
[[part.build]]
do = "display"
block = "black_concrete"
from = [0.15, 1.5, 0.2]
size = [0.7, 0.45, 0.06]
[[part.build]]
do = "display"
block = "light_blue_concrete"
from = [0.19, 1.54, 0.27]
size = [0.62, 0.37, 0.01]
glow = true
[[part.build]]
do = "display"
block = "black_concrete"
from = [2.15, 1.5, 0.2]
size = [0.7, 0.45, 0.06]
[[part.build]]
do = "display"
block = "lime_concrete"
from = [2.19, 1.54, 0.27]
size = [0.62, 0.37, 0.01]
glow = true
[[part.build]]
do = "display"
block = "gray_concrete"
from = [0.45, 1.5, 0.3]
size = [0.1, 0.02, 0.25]
[[part.build]]
do = "display"
block = "white_concrete"
from = [0.25, 1.5, 0.55]
size = [0.5, 0.02, 0.18]
[[part.build]]
do = "display"
block = "white_concrete"
from = [2.25, 1.5, 0.55]
size = [0.5, 0.02, 0.18]

[[build]]
do = "part"
name = "desk"
at = [2, 0, -3]
[[build]]
do = "part"
name = "desk"
at = [6, 0, -3]
[[build]]
do = "part"
name = "desk"
at = [2, 0, 2]
[[build]]
do = "part"
name = "desk"
at = [6, 0, 2]

# The meeting corner (north-west): a table, four chairs, a plant.
[[build]]
do = "blocks"
list = [
  [-8, 0, -4, "dark_oak_fence"], [-7, 0, -4, "dark_oak_fence"],
  [-8, 1, -4, "dark_oak_slab[type=bottom]"], [-7, 1, -4, "dark_oak_slab[type=bottom]"], [-9, 1, -4, "dark_oak_slab[type=bottom]"], [-6, 1, -4, "dark_oak_slab[type=bottom]"],
  [-9, 0, -4, "dark_oak_fence"], [-6, 0, -4, "dark_oak_fence"],
  [-8, 0, -2, "spruce_stairs[facing=south,half=bottom]"], [-7, 0, -2, "spruce_stairs[facing=south,half=bottom]"],
  [-8, 0, -6, "spruce_stairs[facing=north,half=bottom]"], [-7, 0, -6, "spruce_stairs[facing=north,half=bottom]"],
  [-11, 0, -7, "potted_azalea_bush"], [-11, 0, 7, "potted_flowering_azalea_bush"], [11, 0, -7, "potted_bamboo"], [11, 0, 7, "potted_fern"],
  [-11, 0, 0, "barrel[facing=up]"], [-11, 1, 0, "flower_pot"],
  [10, 0, -7, "bookshelf"], [10, 1, -7, "bookshelf"], [9, 0, -7, "bookshelf"],
]

# Ceiling lights.
[[build]]
do = "blocks"
list = [
  [-7, 6, -3, "pearlescent_froglight"], [-7, 6, 3, "pearlescent_froglight"], [0, 6, 0, "pearlescent_froglight"],
  [4, 6, -3, "pearlescent_froglight"], [4, 6, 3, "pearlescent_froglight"], [8, 6, 0, "pearlescent_froglight"],
]

[[build]]
do = "light"
from = [-10, -6]
to = [10, 6]
y = 3
step = 5
level = 12

