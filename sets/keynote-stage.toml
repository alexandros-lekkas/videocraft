# A tech keynote: a big dark hall, a wide stage with a glowing edge, a giant screen wall with a slide, tiered rows
# of seats, spotlights in a black ceiling. Generic: no real company, product or logo. Enclosed, so no backdrop.
# The slide is text displays on a glowing panel; a script can summon its own at the `slide` mark.
name = "keynote-stage"
description = "A dark keynote hall: stage, giant screen with a slide, audience rows, spotlights"
time = 6000
seed = 9

# The hall: 49 wide, 45 deep, 18 high, all dark.
[[build]]
do = "shell"
from = [-24, -1, -22]
to = [24, 17, 22]
floor = "black_concrete"
grain = 0
walls = "black_concrete"
ceiling = "black_concrete"

# A carpet down the middle and across the front of the seats.
[[build]]
do = "box"
from = [-2, 0, -6]
to = [2, 0, 21]
block = "gray_carpet"

# ---------------------------------------------------------------- the stage

[[build]]
do = "box"
from = [-16, 0, -21]
to = [16, 1, -9]
block = "polished_blackstone"

[[build]]
do = "box"
from = [-16, 1, -9]
to = [16, 1, -9]
block = "sea_lantern"

[[build]]
do = "box"
from = [-15, 2, -21]
to = [15, 2, -10]
block = "black_carpet"

# The screen wall: a frame, and the glowing panel in front of it.
[[build]]
do = "box"
from = [-14, 3, -21]
to = [14, 15, -21]
block = "gray_concrete"

[[build]]
do = "display"
block = "blue_concrete"
from = [-13.5, 3.5, -20.0]
size = [27, 11, 0.02]
glow = true

[[build]]
do = "display"
block = "light_blue_concrete"
from = [-13.5, 3.5, -19.97]
size = [27, 0.25, 0.02]
glow = true

[[build]]
do = "text"
text = "THE NEXT BIG THING"
at = [0, 9.4, -19.9]
facing = "south"
scale = 7
color = "white"
bold = true
glow = true
shadow = false

[[build]]
do = "text"
text = "Live on stage  ·  2026"
at = [0, 7.2, -19.9]
facing = "south"
scale = 3.2
color = "#b8d8ff"
glow = true
shadow = false

# Pools of light on the stage floor under the spots (a dark stage reads as lit where the presenter stands).
[[build]]
do = "box"
from = [-3, 2, -14]
to = [3, 2, -10]
block = "gray_carpet"

[[build]]
do = "box"
from = [-2, 2, -13]
to = [2, 2, -11]
block = "light_gray_carpet"

[[build]]
do = "blocks"
list = [
  [-3, 2, -14, "black_carpet"], [3, 2, -14, "black_carpet"], [-3, 2, -10, "black_carpet"], [3, 2, -10, "black_carpet"],
  [-10, 2, -13, "gray_carpet"], [-9, 2, -13, "gray_carpet"], [-8, 2, -13, "gray_carpet"], [-10, 2, -11, "gray_carpet"], [-8, 2, -11, "gray_carpet"],
  [-10, 2, -12, "gray_carpet"], [-8, 2, -12, "gray_carpet"], [-9, 2, -11, "light_gray_carpet"],
]

# A glowing frame round the screen, and an original slide graphic: four bars rising, a trend line of dots.
[[build]]
do = "display"
block = "light_blue_concrete"
from = [-13.7, 3.3, -20.03]
size = [27.4, 0.12, 0.02]
glow = true

[[build]]
do = "display"
block = "light_blue_concrete"
from = [-13.7, 14.58, -20.03]
size = [27.4, 0.12, 0.02]
glow = true

[[build]]
do = "display"
block = "light_blue_concrete"
from = [-13.7, 3.3, -20.03]
size = [0.12, 11.4, 0.02]
glow = true

[[build]]
do = "display"
block = "light_blue_concrete"
from = [13.58, 3.3, -20.03]
size = [0.12, 11.4, 0.02]
glow = true

[[build]]
do = "display"
block = "cyan_concrete"
from = [7.0, 4.6, -19.95]
size = [0.9, 0.8, 0.02]
glow = true

[[build]]
do = "display"
block = "cyan_concrete"
from = [8.3, 4.6, -19.95]
size = [0.9, 1.4, 0.02]
glow = true

[[build]]
do = "display"
block = "light_blue_concrete"
from = [9.6, 4.6, -19.95]
size = [0.9, 2.1, 0.02]
glow = true

[[build]]
do = "display"
block = "white_concrete"
from = [10.9, 4.6, -19.95]
size = [0.9, 3.0, 0.02]
glow = true

[[build]]
do = "display"
block = "light_blue_concrete"
from = [6.6, 4.45, -19.95]
size = [5.6, 0.06, 0.02]
glow = true

# A podium stage left, and a little table with a glass of water.
[[build]]
do = "blocks"
list = [
  [-9, 2, -12, "polished_deepslate"], [-9, 3, -12, "polished_deepslate_slab[type=bottom]"],
  [8, 2, -13, "dark_oak_fence"], [8, 3, -13, "smooth_quartz_slab[type=bottom]"], [8, 3, -13, "smooth_quartz_slab[type=bottom]"],
]

# ---------------------------------------------------------------- the audience: tiered rows, an aisle

[[build]]
do = "box"
from = [-20, 0, 0]
to = [20, 0, 21]
block = "gray_concrete"

[[build]]
do = "box"
from = [-20, 1, 8]
to = [20, 1, 21]
block = "gray_concrete"

[[build]]
do = "box"
from = [-20, 2, 14]
to = [20, 2, 21]
block = "gray_concrete"

[[part]]
name = "row"
[[part.build]]
do = "box"
from = [-18, 0, 0]
to = [-3, 0, 0]
block = "polished_blackstone_stairs[facing=south,half=bottom]"
[[part.build]]
do = "box"
from = [3, 0, 0]
to = [18, 0, 0]
block = "polished_blackstone_stairs[facing=south,half=bottom]"

[[build]]
do = "part"
name = "row"
at = [0, 1, 2]
[[build]]
do = "part"
name = "row"
at = [0, 1, 4]
[[build]]
do = "part"
name = "row"
at = [0, 1, 6]
[[build]]
do = "part"
name = "row"
at = [0, 2, 9]
[[build]]
do = "part"
name = "row"
at = [0, 2, 11]
[[build]]
do = "part"
name = "row"
at = [0, 3, 15]
[[build]]
do = "part"
name = "row"
at = [0, 3, 17]
[[build]]
do = "part"
name = "row"
at = [0, 3, 19]

# ---------------------------------------------------------------- light: spotlights on the stage, a dim house

# Visible fixtures in the ceiling: a truss of lamps over the stage and a few over the house.
[[build]]
do = "box"
from = [-14, 16, -8]
to = [14, 16, -8]
block = "polished_deepslate"

[[build]]
do = "blocks"
list = [
  [-12, 14, -6, "iron_chain[axis=y]"], [-12, 15, -6, "iron_chain[axis=y]"], [-12, 13, -6, "polished_deepslate"], [-12, 12, -6, "redstone_lamp[lit=true]"],
  [-4, 14, -6, "iron_chain[axis=y]"], [-4, 15, -6, "iron_chain[axis=y]"], [-4, 13, -6, "polished_deepslate"], [-4, 12, -6, "redstone_lamp[lit=true]"],
  [4, 14, -6, "iron_chain[axis=y]"], [4, 15, -6, "iron_chain[axis=y]"], [4, 13, -6, "polished_deepslate"], [4, 12, -6, "redstone_lamp[lit=true]"],
  [12, 14, -6, "iron_chain[axis=y]"], [12, 15, -6, "iron_chain[axis=y]"], [12, 13, -6, "polished_deepslate"], [12, 12, -6, "redstone_lamp[lit=true]"],
]

[[build]]
do = "box"
from = [-14, 16, -6]
to = [14, 16, -6]
block = "polished_deepslate"

# Step lights along the aisle, so the dark house has lines leading to the stage.
[[build]]
do = "blocks"
list = [
  [-3, 1, 1, "sea_lantern"], [3, 1, 1, "sea_lantern"], [-3, 1, 5, "sea_lantern"], [3, 1, 5, "sea_lantern"],
  [-3, 2, 9, "sea_lantern"], [3, 2, 9, "sea_lantern"], [-3, 2, 12, "sea_lantern"], [3, 2, 12, "sea_lantern"],
  [-3, 3, 15, "sea_lantern"], [3, 3, 15, "sea_lantern"], [-3, 3, 19, "sea_lantern"], [3, 3, 19, "sea_lantern"],
]

[[build]]
do = "blocks"
list = [
  [-12, 15, -8, "redstone_lamp[lit=true]"], [-6, 15, -8, "redstone_lamp[lit=true]"], [0, 15, -8, "redstone_lamp[lit=true]"],
  [6, 15, -8, "redstone_lamp[lit=true]"], [12, 15, -8, "redstone_lamp[lit=true]"],
  [-10, 16, 6, "ochre_froglight"], [10, 16, 6, "ochre_froglight"], [-10, 16, 16, "ochre_froglight"], [10, 16, 16, "ochre_froglight"],
]

# The stage is bright where the presenter stands; the house falls off into the dark.
[[build]]
do = "light"
at = [[0, 3, -12], [-5, 3, -12], [5, 3, -12], [0, 4, -15], [-10, 3, -12], [10, 3, -12], [0, 3, -9], [-5, 3, -9], [5, 3, -9]]
level = 15

[[build]]
do = "light"
from = [-18, 1]
to = [18, 21]
y = 5
step = 6
level = 11

# ---------------------------------------------------------------- marks

[[mark]]
name = "stage-center"
at = [0, 2, -12]
facing = "south"

[[mark]]
name = "podium"
at = [-9, 2, -11]
facing = "south"

[[mark]]
name = "slide"
at = [0, 9, -20]

[[mark]]
name = "stage-walk"
path = [[-7, 2, -12], [0, 2, -12], [7, 2, -12]]

[[mark]]
name = "seat-front"
at = [5, 1, 2]
facing = "north"

[[mark]]
name = "cam-wide"
eye = [0, 9, 21]
look = [0, 5, -14]
fov = 62

[[mark]]
name = "cam-presenter"
eye = [0, 3.4, -5]
look = [0, 3.2, -12]
fov = 40

[[mark]]
name = "cam-side"
eye = [15, 5, -2]
look = [0, 3, -13]
fov = 50

[[mark]]
name = "cam-audience"
eye = [0, 4.5, -9]
look = [0, 2, 12]
fov = 70

[[mark]]
