# Market Lane: a curving village lane of cobbles with a pale centre line, about 220 blocks from the west hills to an
# open end over a valley in the east, late afternoon. Ten stretches that each look different, so no two lead tracks
# in a row show the same place:
#
#   d   0-30   the market: three stalls with striped awnings, a cart, lanterns, cottages behind
#   d  32-46   a plank bridge over a stream (lily pads, reeds, willows)
#   d  48-64   the orange stall, barrels and hay
#   d  66-82   the well with flower pots, a bench
#   d  84-102  lantern posts both sides, flower beds, cottages
#   d 104-118  the notice board with the Talent Night poster (north side)
#   d 120-138  the corner: the lane bends round a cottage and hay
#   d 140-158  the cart by the wheat field
#   d 160-180  the flower stall and the orchard
#   d 184-222  the open end: a rail, a bench and the valley beyond
#
# `d` is blocks along the lane mark from its west end; `side` is blocks to the right of walking east (south is +).
# Paths for the benchmark's lead tracks are marks below (shot-01 … shot-28, spot-1 … spot-6), each walked east
# (so a camera ahead looks back west down the lane) except shot-28, walked west with the valley behind.
name = "market-lane"
description = "A curving market lane at golden hour: stalls, a bridge, a well, a notice board, an open end over a valley"
time = 11000
weather = "clear"
biome = "minecraft:plains"
seed = 11

