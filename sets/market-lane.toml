# Market Lane: a curving village lane with a pale centre line, about 237 blocks from the west hills to an open end
# over a valley in the east, late afternoon. It is dressed for a low wide lens: a lead track films a walker from 4-6
# blocks ahead at one block up with a 105° lens, so every stretch has stall fronts, props and lantern posts right at
# the kerb (3-6 blocks from the centre line) and cottage fronts with doors on the lane just behind (8-10), and each
# stretch has its own colours, props and lane surface:
#
#   d   0-30   the market: four striped stalls at the kerb, bunting across the lane, barrels and sacks, a cart
#   d  31-47   the plank bridge over a wide stream: willows, reeds, lily pads, lanterns on the bridge posts
#   d  48-64   the produce stretch: the orange stall, pumpkins, hay, a red barn-cottage, woodpiles
#   d  66-82   the well: benches, planters and window boxes, flowering azaleas
#   d  84-102  the lantern street: a terrace of cottages close on both sides, lanterns every four blocks, stone setts
#   d 104-118  the notice board with the Talent Night poster (north side), banners, benches
#   d 120-138  the corner: a big cottage on the bend, haystacks and a rail fence with lanterns
#   d 140-158  the farm: a wheat field behind a kerb fence, a cart, a scarecrow, a dirt-path surface
#   d 160-182  the orchard: the pink flower stall, cherry trees close by, petals and pink planters
#   d 184-237  the open end: a rail, benches, the valley beyond
#
# `d` is blocks along the lane mark from its west end; `side` is blocks to the right of walking east (south is +).
# Paths for the benchmark's lead tracks are marks below (shot-01 … shot-28, spot-1 … spot-6), each walked east
# (so a camera ahead looks back west down the lane) except shot-28, walked west with the valley behind.
name = "market-lane"
description = "A curving market lane at golden hour: stalls, a bridge, a well, a notice board, an open end over a valley"
time = 11000
weather = "clear"
biome = "minecraft:plains"
seed = 11

